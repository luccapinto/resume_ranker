version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: resume_ranker_postgres
    environment:
      POSTGRES_DB: resume_ranker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # loopback apenas: o unico consumidor e a API uvicorn no host
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: resume_ranker_qdrant
    ports:
      # loopback apenas: o unico consumidor e a API uvicorn no host
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  postgres_data:
  qdrant_data:
